<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-light);font-family:var(--font-sans)}.row{display:flex;gap:0}.sw{flex:1;height:84px;display:flex;align-items:flex-end;padding:8px;font-size:10px;letter-spacing:.06em}.lbl{font-size:10px;color:var(--fg-on-light-muted);margin-top:6px;letter-spacing:.04em}</style></head><body><div class="row"><div style="flex:1"><div class="sw" style="background:var(--bronze-300);color:#14171b">300</div><div class="lbl">--bronze-300</div></div><div style="flex:1"><div class="sw" style="background:var(--bronze-400);color:#14171b">400 · hover</div><div class="lbl">--bronze-400</div></div><div style="flex:1"><div class="sw" style="background:var(--bronze-500);color:#14171b">500 · accent</div><div class="lbl">--bronze-500</div></div><div style="flex:1"><div class="sw" style="background:var(--bronze-600);color:#f3f0ea">600 · press</div><div class="lbl">--bronze-600</div></div><div style="flex:1"><div class="sw" style="background:var(--bronze-700);color:#f3f0ea">700 · on light</div><div class="lbl">--bronze-700</div></div></div></body></html>
